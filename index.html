<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NDTV News Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f5;
      color: #18181b;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: #d71920;
      color: #fff;
      padding: 18px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 1.4rem; }
    header p { margin: 6px 0 0; font-size: 0.95rem; opacity: 0.9; }
    main {
      width: 100%;
      max-width: 520px;
      padding: 20px;
      flex: 1;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: 0;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    }
    .link { text-align: center; margin-top: 14px; font-size: 0.9rem; }
    .link a { color: #d71920; }
    footer { padding: 16px; font-size: 0.8rem; color: #71717a; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>NDTV News Assistant</h1>
    <p>Ask about the latest news, topics and stories</p>
  </header>

  <main>
    <iframe
      src="https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/09/26/09/20260926090359-0IHT7TQR.json"
      title="NDTV chatbot">
    </iframe>
    <div class="link">
      Chat not loading?
      <a href="https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/09/26/09/20260926090359-0IHT7TQR.json" target="_blank" rel="noopener">Open it in a new tab</a>
    </div>
  </main>

  <footer>Built with Botpress</footer>
</body>
</html>
