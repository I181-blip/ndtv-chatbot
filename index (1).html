<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NDTV News Assistant</title>

  <!-- Botpress webchat embed code -->
  <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2026/09/26/09/20260926090359-28H2BAN3.js" defer></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f5;
      color: #18181b;
      min-height: 100vh;
    }
    header {
      background: #d71920;
      color: #fff;
      padding: 28px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 1.6rem; }
    header p { margin: 8px 0 0; opacity: 0.9; }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 28px 20px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    .card h2 { margin-top: 0; font-size: 1.1rem; }
    .card ul { padding-left: 20px; margin-bottom: 0; }
    footer { text-align: center; padding: 16px; font-size: 0.8rem; color: #71717a; }
  </style>
</head>
<body>
  <header>
    <h1>NDTV News Assistant</h1>
    <p>Ask about the latest news, topics and stories</p>
  </header>

  <main>
    <div class="card">
      <h2>How to use</h2>
      <p>Click the chat bubble at the bottom right of the screen to start talking to the assistant.</p>
    </div>
    <div class="card">
      <h2>Try asking</h2>
      <ul>
        <li>Latest India news today</li>
        <li>Business headlines this week</li>
        <li>Sports news from Mumbai</li>
      </ul>
    </div>
  </main>

  <footer>Built with Botpress</footer>
</body>
</html>
